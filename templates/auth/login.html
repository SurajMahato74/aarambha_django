<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Login – Simple Test</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap">
  
  <style>
    body {
      font-family: 'Inter', system-ui, sans-serif;
      background: #f8fafc;
      min-height: 100dvh;
      display: grid;
      place-items: center;
    }
    .card {
      background: white;
      border-radius: 12px;
      box-shadow: 0 10px 30px -10px rgba(0,0,0,0.12);
      padding: 2.5rem;
      width: 100%;
      max-width: 380px;
    }
    .input-group {
      position: relative;
    }
    .input-group input {
      width: 100%;
      padding: 0.75rem 1rem 0.75rem 2.75rem;
      border: 1px solid #d1d5db;
      border-radius: 6px;
      font-size: 1rem;
    }
    .input-group input:focus {
      outline: none;
      border-color: #3b82f6;
      box-shadow: 0 0 0 3px rgba(59,130,246,0.15);
    }
    .icon {
      position: absolute;
      left: 1rem;
      top: 50%;
      transform: translateY(-50%);
      color: #6b7280;
    }
  </style>
</head>
<body>

  <div class="card">

    <div class="text-center mb-8">
      <h1 class="text-2xl font-semibold text-gray-800">Sign In</h1>
      <p class="text-gray-500 mt-1 text-sm">Testing login interface</p>
    </div>

    <form id="loginForm" class="space-y-5">

      <!-- Username -->
      <div class="input-group">
        <span class="icon material-symbols-outlined">person</span>
        <input 
          type="text" 
          id="username" 
          placeholder="Username" 
          required
          autocomplete="username"
        />
      </div>

      <!-- Password -->
      <div class="input-group">
        <span class="icon material-symbols-outlined">lock</span>
        <input 
          type="password" 
          id="password" 
          placeholder="Password" 
          required
          autocomplete="current-password"
        />
        <button 
          type="button" 
          onclick="togglePassword()"
          class="absolute right-3 top-1/2 -translate-y-1/2 text-gray-500 hover:text-gray-700"
        >
          <span id="eyeIcon" class="material-symbols-outlined">visibility</span>
        </button>
      </div>

      <!-- Submit -->
      <button 
        type="submit"
        class="w-full bg-blue-600 hover:bg-blue-700 text-white font-medium py-3 rounded-lg transition mt-2"
      >
        Log In
      </button>

      <div id="message" class="text-center text-sm min-h-[1.25rem] text-red-600"></div>

    </form>

  </div>

  <!-- Material Symbols (icons) -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />

  <script>
    function togglePassword() {
      const pass = document.getElementById('password');
      const icon = document.getElementById('eyeIcon');
      
      if (pass.type === 'password') {
        pass.type = 'text';
        icon.textContent = 'visibility_off';
      } else {
        pass.type = 'password';
        icon.textContent = 'visibility';
      }
    }

    // Just prevent submit & show fake message (for testing UI)
    document.getElementById('loginForm').addEventListener('submit', function(e) {
      e.preventDefault();
      
      const msg = document.getElementById('message');
      const user = document.getElementById('username').value.trim();
      
      if (!user || !document.getElementById('password').value) {
        msg.textContent = 'Please fill both fields';
        return;
      }
      
      msg.className = 'text-center text-sm text-green-600';
      msg.textContent = 'Logging in... (this is just a test)';
      
      setTimeout(() => {
        msg.textContent = 'Welcome, ' + user + '! (fake success)';
      }, 1200);
    });
  </script>

</body>
</html>
